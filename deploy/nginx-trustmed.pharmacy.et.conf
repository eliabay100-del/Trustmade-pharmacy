# ---------------------------------------------------------------------------
# TRUSTMED PHARMACY - nginx site configuration
# ---------------------------------------------------------------------------
#
# Ask Ethio Telecom which of nginx or Apache fronts the account before using
# this. If they hand you a control panel with a "PHP version" dropdown and
# document-root field, use the Apache notes in docs/DEPLOYMENT.md instead and
# set the document root to the public/ folder.
#
# Install: /etc/nginx/sites-available/trustmed.pharmacy.et
# Enable:  ln -s ../sites-available/trustmed.pharmacy.et \
#              /etc/nginx/sites-enabled/trustmed.pharmacy.et
# Then:    nginx -t && systemctl reload nginx
#
# Note there is NO trailing slash on APP_URL, and the document root is the
# public/ folder - never the project root. Pointing the server at the project
# root would serve .env, the database backups and the whole vendor tree.
# ---------------------------------------------------------------------------

# FastCGI pass-through. Match the socket path to the PHP version Ethio Telecom
# installed; PHP 8.3 and 8.4 use a different one.
#
#   PHP 8.2:  /run/php/php8.2-fpm.sock
#   PHP 8.3:  /run/php/php8.3-fpm.sock
#   PHP 8.4:  /run/php/php8.4-fpm.sock
#
# If the account is Apache rather than nginx, this whole file is unnecessary.

server {
    listen 80;
    listen [::]:80;

    # Leave this commented until a certificate exists, otherwise Certbot's
    # HTTP challenge cannot reach the site.
    server_name trustmed.pharmacy.et www.trustmed.pharmacy.et;

    # Where the project lives. CHANGE THIS to the real path.
    root /home/youruser/trustmed/public;
    index index.php;

    charset utf-8;
    client_max_body_size 12M;   # room for a branding image upload

    # ---- security headers -------------------------------------------------
    # The application also sends these through its SecurityHeaders middleware.
    # They are repeated here so they apply to static files and error responses
    # too, which never pass through PHP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- gzip -------------------------------------------------------------
    # On a slow connection, text compression is the single biggest win. The
    # built CSS and JS are large and compress extremely well.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    # ---- routing ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Nothing outside public/ is ever reachable. Belt and braces: even a
    # mis-set root cannot expose .env, storage/ or vendor/.
    #
    # NOTE: /storage/ itself is deliberately NOT in this list. public/storage
    # is a symlink to storage/app/public, and that is how the pharmacy's logo
    # is served on every page. Denying it breaks the branding everywhere.
    # The project's real storage/ is covered by the deny rules here and by the
    # database-dump rule below.
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ ^/(app|bootstrap|config|database|resources|routes|tests|vendor)/ {
        deny all;
        return 404;
    }

    # The catastrophic case, whatever the document root turns out to be: a
    # database dump must never be downloadable. The nightly backup writes
    # .sql and .sql.gz files, and anyone who guesses the path gets the whole
    # pharmacy - every sale, every supplier, every password hash.
    location ~ \.(sql|sql\.gz|dump|tar\.gz)$ {
        deny all;
        return 404;
    }

    # Explicit belt-and-braces for the private disk, in case the document root
    # is ever pointed at the project root by mistake.
    location ^~ /storage/app/private {
        deny all;
        return 404;
    }
    location ^~ /storage/framework {
        deny all;
        return 404;
    }
    location ^~ /storage/logs {
        deny all;
        return 404;
    }

    # ---- PHP --------------------------------------------------------------
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # A pharmacy sale is a handful of queries; long timeouts only hide
        # trouble. Queue work is synchronous, so this must outlast the slowest
        # screen (the sales report).
        fastcgi_read_timeout 120s;
    }

    # ---- static assets ----------------------------------------------------
    # The fingerprinted build output can be cached hard, because a changed file
    # gets a new name. Never cache index.php or anything in /.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Block dotfiles in the URI as well as on disk.
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/trustmed.access.log;
    error_log  /var/log/nginx/trustmed.error.log;
}


# ---------------------------------------------------------------------------
# HTTPS - Certbot writes this block for you.
#
#   sudo certbot certonly --webroot -w /home/youruser/trustmed/public \
#       -d trustmed.pharmacy.et
#
# It needs the HTTP server block above to already be live and port 80 open.
# Then: nginx -t && systemctl reload nginx
#
# Afterwards the HTTP block should redirect rather than serve, and the
# Strict-Transport-Security header above is already in place.
# ---------------------------------------------------------------------------
