# ---------------------------------------------------------------------------
# TRUSTMED PHARMACY - Apache virtual host
# ---------------------------------------------------------------------------
#
# Use this when Ethio Telecom confirms the account runs Apache rather than
# nginx. Most shared hosting does, and a control panel will usually offer to
# set the document root for you - set it to the public/ folder:
#
#     /home/youruser/trustmed/public          <- this, not the project root
#
# Pointing the document root at the project root instead would publish .env,
# the database backups and the whole vendor tree to anyone who guesses a URL.
# public/.htaccess already handles routing, compression and headers; this file
# only adds the server-level pieces.
#
# Install: /etc/apache2/sites-available/trustmed.pharmacy.et.conf
# Enable:  a2ensite trustmed.pharmacy.et && a2enmod rewrite headers expires deflate
#         apache2ctl configtest && systemctl reload apache2
# ---------------------------------------------------------------------------

<VirtualHost *:80>
    ServerName trustmed.pharmacy.et
    ServerAlias www.trustmed.pharmacy.et

    # CHANGE THIS to the real path to the project.
    DocumentRoot /home/youruser/trustmed/public

    <Directory /home/youruser/trustmed/public>
        Options -Indexes +FollowSymLinks
        # Required for public/.htaccess to be read at all. If the host has
        # AllowOverride None, ask support to change it - without it the
        # rewrite rules are ignored and every URL 404s.
        AllowOverride All
        Require all granted
    </Directory>

    # Belt and braces. The document root is already public/, so these paths
    # should not be reachable, but an explicit deny survives a wrong root.
    <DirectoryMatch "^/home/youruser/trustmed/(app|bootstrap|config|database|resources|routes|tests|vendor|storage)">
        Require all denied
    </DirectoryMatch>

    # Redirect any other vhost that lands on this IP, so the site is never
    # reachable by bare IP with the wrong host name.
    <Directory /home/youruser/trustmed>
        Options -Indexes
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/trustmed.error.log
    CustomLog ${APACHE_LOG_DIR}/trustmed.access.log combined
</VirtualHost>

# ---------------------------------------------------------------------------
# HTTPS. Leave this commented until a certificate exists, or Certbot's HTTP
# challenge cannot answer.
#
#   sudo certbot certonly --webroot -w /home/youruser/trustmed/public \
#       -d trustmed.pharmacy.et
#
# Then add the :443 block certbot writes, and change the :80 block above to
# redirect:
#
#   RewriteEngine On
#   RewriteCond %{REQUEST_URI} !^/\.well-known/
#   RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
# ---------------------------------------------------------------------------
